{% macro render_period_selector(id_prefix, default_period='', default_period_data='null', period_name='period', period_data_name='period_data') %}
<div class="period-selector-container">
    <input type="hidden" name="{{ period_name }}" id="{{ id_prefix }}Text" value="{{ default_period }}">
    <input type="hidden" name="{{ period_data_name }}" id="{{ id_prefix }}Data" value="{{ default_period_data }}">

    <div class="d-flex align-items-center gap-2 mb-2">
        <select class="form-select form-select-sm" id="{{ id_prefix }}Type" style="max-width: 200px;">
            <option value="" disabled selected>-- Выберите тип --</option>
            <option value="quarter">Квартал</option>
            <option value="month">Месяц</option>
            <option value="halfyear">Полугодие</option>
            <option value="year">Год</option>
            <option value="academic">Учебный год</option>
            <option value="week">Неделя</option>
            <option value="date">Конкретная дата</option>
            <option value="range">Период дат (От и До)</option>
        </select>
        <div id="{{ id_prefix }}Display" class="small fw-bold text-primary-copp"></div>
    </div>

    <div id="{{ id_prefix }}Fields" class="d-flex flex-wrap gap-2 align-items-center bg-white p-2 rounded border border-light-subtle empty-hide">
        <!-- Dynamic fields will be injected here via JS -->
    </div>
</div>

<script>
    document.addEventListener("DOMContentLoaded", function() {
        if (typeof window.initPeriodSelector === 'function') {
            window.initPeriodSelector('{{ id_prefix }}', '{{ default_period_data | safe }}');
        } else {
            console.error("period_selector.js not loaded!");
        }
    });
</script>
<style>
    .empty-hide:empty { display: none !important; }
</style>
{% endmacro %}
