<div class="users-sub-tabs">
    <!-- Капсульная навигация -->
    <ul class="nav nav-pills segmented-control bg-white border shadow-sm p-1 rounded-pill flex-nowrap overflow-auto mb-4 gap-sm-nowrap" id="usersSubTabs" role="tablist" style="width: max-content;">
        <li class="nav-item" role="presentation">
            <button class="nav-link active rounded-pill px-4 py-2 fw-medium" id="user-list-tab" data-bs-toggle="tab" data-bs-target="#user-list" type="button" role="tab">
                <i class="bi bi-people me-1"></i> Список пользователей
            </button>
        </li>
        <li class="nav-item" role="presentation">
            <button class="nav-link rounded-pill px-4 py-2 fw-medium" id="user-registration-tab" data-bs-toggle="tab" data-bs-target="#user-registration" type="button" role="tab">
                <i class="bi bi-person-plus me-1"></i> Добавить пользователя
            </button>
        </li>
        <li class="nav-item" role="presentation">
            <button class="nav-link rounded-pill px-4 py-2 fw-medium" id="user-bulk-add-tab" data-bs-toggle="tab" data-bs-target="#user-bulk-add" type="button" role="tab">
                <i class="bi bi-file-earmark-excel me-1"></i> Массовая загрузка
            </button>
        </li>
    </ul>

    <!-- Контент вкладок -->
    <div class="tab-content" id="usersSubTabsContent">
        <div class="tab-pane fade show active" id="user-list" role="tabpanel">
            {% include 'admin_tabs/users/user_list.html' %}
        </div>
        
        <div class="tab-pane fade" id="user-registration" role="tabpanel">
            {% include 'admin_tabs/users/user_registration.html' %}
        </div>
        
        <div class="tab-pane fade" id="user-bulk-add" role="tabpanel">
            {% include 'admin_tabs/users/user_bulk_add.html' %}
        </div>
    </div>
</div>
