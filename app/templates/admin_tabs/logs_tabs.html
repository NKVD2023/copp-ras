<!-- 
  LOGS_TABS.HTML
  Журнал действий системы (аудит) с ленивой загрузкой (Lazy Loading),
  серверной пагинацией, фильтрами и экспортом в Excel (CSV).
  Оформлен строго по стандартам ЦОПП (.table-registry-card, Bootstrap Icons).
-->

<div class="card table-registry-card position-relative">
    <!-- Верхняя панель: Заголовок + Счётчик + Действия -->
    <div class="p-4 border-bottom border-light-subtle">
        <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-3">
            <div>
                <h6 class="fw-bold mb-1 text-dark">Журнал действий системы</h6>
                <p class="text-muted small mb-0">Аудит активности пользователей, изменений данных и системных событий</p>
            </div>
            <div class="d-flex align-items-center gap-2">
                <span class="badge bg-light text-secondary border px-3 py-2 fw-medium" id="logsCountBadge">
                    Показано: <strong class="text-dark" id="logsFilteredCount">0</strong> из <span id="logsTotalCount">0</span>
                </span>
                
                <!-- Кнопка обновления логов -->
                <button type="button" class="btn btn-outline-copp btn-sm shadow-sm d-flex align-items-center gap-1" id="logsRefreshBtn" onclick="loadLogs(logsCurrentPage, true)" title="Обновить журнал">
                    <i class="bi bi-arrow-clockwise" id="logsRefreshIcon"></i>
                    <span>Обновить</span>
                </button>

                <!-- Серверный экспорт в Excel -->
                <button type="button" class="btn btn-outline-success btn-sm shadow-sm d-flex align-items-center gap-1" id="logsExportBtn" onclick="exportLogs()" title="Экспорт с учетом фильтров в Excel">
                    <i class="bi bi-file-earmark-spreadsheet"></i>
                    <span>Excel</span>
                </button>

                <!-- Очистка логов (меню с безопасными режимами) -->
                <div class="dropdown d-inline-block">
                    <button class="btn btn-outline-danger btn-sm dropdown-toggle shadow-sm d-flex align-items-center gap-1" type="button" data-bs-toggle="dropdown" aria-expanded="false" title="Очистка записей">
                        <i class="bi bi-trash3"></i>
                        <span>Очистка</span>
                    </button>
                    <ul class="dropdown-menu dropdown-menu-end shadow-sm border-light-subtle">
                        <li>
                            <button class="dropdown-item text-secondary py-2 d-flex align-items-center gap-2" type="button" onclick="confirmClearLogs('180_days')">
                                <i class="bi bi-clock-history text-muted"></i>
                                <span>Старше 6 месяцев</span>
                            </button>
                        </li>
                        <li>
                            <button class="dropdown-item text-secondary py-2 d-flex align-items-center gap-2" type="button" onclick="confirmClearLogs('365_days')">
                                <i class="bi bi-calendar-x text-muted"></i>
                                <span>Старше 1 года</span>
                            </button>
                        </li>
                        <li><hr class="dropdown-divider my-1"></li>
                        <li>
                            <button class="dropdown-item text-danger fw-semibold py-2 d-flex align-items-center gap-2" type="button" onclick="confirmClearLogs('all')">
                                <i class="bi bi-exclamation-triangle"></i>
                                <span>Очистить полностью</span>
                            </button>
                        </li>
                    </ul>
                </div>
            </div>
        </div>

        <!-- Фильтры в один ряд -->
        <div class="row g-2 align-items-center">
            <!-- Поиск -->
            <div class="col-12 col-md-4">
                <div class="input-group input-group-sm">
                    <span class="input-group-text bg-light border-end-0 text-muted">
                        <i class="bi bi-search"></i>
                    </span>
                    <input type="text" id="logsSearch" class="form-control bg-light border-start-0 ps-0" placeholder="Поиск по действию, деталям, логину, IP..." autocomplete="off">
                    <button class="btn btn-light border border-start-0 text-muted d-none" type="button" id="logsClearSearchBtn">
                        <i class="bi bi-x-lg" style="font-size: 0.75rem;"></i>
                    </button>
                </div>
            </div>

            <!-- Фильтр по роли -->
            <div class="col-6 col-md-2">
                <select id="logsRoleFilter" class="form-select form-select-sm bg-light border-light-subtle text-secondary">
                    <option value="">Все роли</option>
                    <option value="admin">Администратор</option>
                    <option value="manager">Руководитель</option>
                    <option value="user">Пользователь</option>
                    <option value="system">Система</option>
                </select>
            </div>

            <!-- Фильтр по типу действия -->
            <div class="col-6 col-md-3">
                <select id="logsActionFilter" class="form-select form-select-sm bg-light border-light-subtle text-secondary">
                    <option value="">Все действия</option>
                </select>
            </div>

            <!-- Фильтр по дате -->
            <div class="col-10 col-md-2">
                <select id="logsDateRangeFilter" class="form-select form-select-sm bg-light border-light-subtle text-secondary">
                    <option value="">За всё время</option>
                    <option value="today">За сегодня</option>
                    <option value="week">За 7 дней</option>
                    <option value="month">За 30 дней</option>
                </select>
            </div>

            <!-- Кнопка сброса фильтров -->
            <div class="col-2 col-md-1 text-end">
                <button type="button" class="btn btn-outline-secondary btn-sm w-100 d-none" id="logsResetFiltersBtn" title="Сбросить все фильтры">
                    <i class="bi bi-arrow-counterclockwise"></i>
                </button>
            </div>
        </div>
    </div>

    <!-- Таблица журнала -->
    <div class="table-responsive mb-0" id="logsTableContainer">
        <table class="table table-hover align-middle mb-0" id="logsTable">
            <thead class="table-light text-muted small text-uppercase">
                <tr>
                    <th class="ps-4 py-3 fw-semibold border-bottom" style="width: 155px;">Дата и время</th>
                    <th class="py-3 fw-semibold border-bottom" style="width: 210px;">Пользователь</th>
                    <th class="py-3 fw-semibold border-bottom" style="width: 180px;">Действие</th>
                    <th class="py-3 fw-semibold border-bottom">Подробности</th>
                    <th class="pe-4 py-3 fw-semibold border-bottom text-end" style="width: 140px;">IP-адрес</th>
                </tr>
            </thead>
            <tbody id="logsTableBody">
                <tr id="logsInitialRow">
                    <td colspan="5" class="text-center py-5 text-muted">
                        <div class="spinner-border spinner-border-sm me-2 text-primary" role="status" style="color: #00334e !important;"></div>
                        <span>Загрузка журнала действий...</span>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

    <!-- Подвал карточки: Пагинация и выбор количества строк -->
    <div class="p-3 border-top border-light-subtle bg-light d-flex flex-wrap justify-content-between align-items-center gap-3" id="logsPaginationBar">
        <div class="d-flex align-items-center gap-2 text-muted small">
            <span>Строк на странице:</span>
            <select id="logsPerPageSelect" class="form-select form-select-sm bg-white border-light-subtle w-auto text-secondary" onchange="changeLogsPerPage(this.value)">
                <option value="25">25</option>
                <option value="50" selected>50</option>
                <option value="100">100</option>
                <option value="200">200</option>
            </select>
            <span class="ms-2" id="logsPageRangeText">Показано 0–0</span>
        </div>

        <nav aria-label="Навигация по журналу">
            <ul class="pagination pagination-sm mb-0" id="logsPaginationNav">
                <!-- Кнопки пагинации генерируются через JS -->
            </ul>
        </nav>
    </div>
</div>

<script>
    // ── Глобальное состояние модуля логов ─────────────────────────────────────────
    let logsCurrentPage = 1;
    let logsPerPage = 50;
    let logsTotalPages = 1;
    let logsTotalCount = 0;
    let logsSearchTimer = null;
    let logsLoadedOnce = false;
    let logsActionsLoaded = false;
    const csrfToken = '{{ csrf_token() }}';

    function escapeHtml(text) {
        if (!text) return '';
        const map = {
            '&': '&amp;',
            '<': '&lt;',
            '>': '&gt;',
            '"': '&quot;',
            "'": '&#039;'
        };
        return String(text).replace(/[&<>"']/g, function(m) { return map[m]; });
    }

    // ── Загрузка логов с сервера (Lazy Loading & Pagination) ─────────────────────
    function loadLogs(page = 1, forceRefresh = false) {
        logsCurrentPage = page;
        const tbody = document.getElementById('logsTableBody');
        const refreshIcon = document.getElementById('logsRefreshIcon');

        if (refreshIcon) {
            refreshIcon.classList.add('spin-animation');
        }

        // Показываем индикатор загрузки, если нужно
        if (!logsLoadedOnce || forceRefresh) {
            tbody.innerHTML = `
                <tr>
                    <td colspan="5" class="text-center py-5 text-muted">
                        <div class="spinner-border spinner-border-sm me-2" role="status" style="color: #00334e;"></div>
                        <span>Загрузка данных журнала...</span>
                    </td>
                </tr>
            `;
        }

        // Собираем параметры фильтров
        const search = document.getElementById('logsSearch')?.value.trim() || '';
        const role = document.getElementById('logsRoleFilter')?.value || '';
        const action = document.getElementById('logsActionFilter')?.value || '';
        const dateRange = document.getElementById('logsDateRangeFilter')?.value || '';

        // Проверяем, активны ли фильтры для показа кнопки "Сбросить"
        updateResetButtonState(search, role, action, dateRange);

        const params = new URLSearchParams({
            page: logsCurrentPage,
            per_page: logsPerPage,
            search: search,
            role: role,
            action: action,
            date_range: dateRange
        });

        fetch(`/admin/logs/api?${params.toString()}`, {
            headers: {
                'X-Requested-With': 'XMLHttpRequest'
            }
        })
        .then(response => {
            if (!response.ok) {
                throw new Error('Ошибка сети при загрузке журнала');
            }
            return response.json();
        })
        .then(data => {
            logsLoadedOnce = true;
            if (refreshIcon) refreshIcon.classList.remove('spin-animation');

            if (data.status === 'success') {
                renderLogsTable(data.items);
                renderPagination(data.pagination);
                
                // Заполняем выпадающий список действий при первой успешной загрузке
                if (!logsActionsLoaded && data.unique_actions) {
                    populateActionsFilter(data.unique_actions);
                    logsActionsLoaded = true;
                }
            } else {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="5" class="text-center py-4 text-danger">
                            <i class="bi bi-exclamation-circle me-1"></i> Не удалось загрузить журнал: ${escapeHtml(data.message || 'Ошибка')}
                        </td>
                    </tr>
                `;
            }
        })
        .catch(err => {
            if (refreshIcon) refreshIcon.classList.remove('spin-animation');
            tbody.innerHTML = `
                <tr>
                    <td colspan="5" class="text-center py-4 text-danger">
                        <i class="bi bi-exclamation-triangle me-1"></i> Ошибка соединения с сервером при получении записей.
                    </td>
                </tr>
            `;
            console.error('Logs fetch error:', err);
        });
    }

    // ── Отрисовка строк таблицы ──────────────────────────────────────────────────
    function renderLogsTable(items) {
        const tbody = document.getElementById('logsTableBody');
        if (!items || items.length === 0) {
            tbody.innerHTML = `
                <tr>
                    <td colspan="5" class="text-center py-5 text-muted">
                        <i class="bi bi-journal-x fs-3 d-block mb-2 text-secondary"></i>
                        <span>Записей в журнале не найдено. Попробуйте изменить параметры поиска или фильтров.</span>
                    </td>
                </tr>
            `;
            return;
        }

        let html = '';
        items.forEach(log => {
            // Формирование бейджа роли
            let roleBadge = '';
            const uRole = log.user?.role || 'system';
            if (uRole === 'admin') {
                roleBadge = `<span class="badge rounded-pill fw-bold badge-role badge-role-admin">АДМИН</span>`;
            } else if (uRole === 'manager') {
                roleBadge = `<span class="badge rounded-pill fw-bold badge-role badge-role-manager">РЕДАКТОР</span>`;
            } else if (uRole === 'user') {
                roleBadge = `<span class="badge rounded-pill fw-bold badge-role badge-role-user">ПОЛЬЗОВАТЕЛЬ</span>`;
            } else {
                roleBadge = `<span class="badge rounded-pill fw-bold bg-light text-secondary border">СИСТЕМА</span>`;
            }

            const username = escapeHtml(log.user?.username || 'Система');
            const userDesc = log.user?.description ? `<div class="small text-muted text-truncate" style="max-width: 190px;" title="${escapeHtml(log.user.description)}">${escapeHtml(log.user.description)}</div>` : '';
            const actionText = escapeHtml(log.action || '');
            const detailsText = escapeHtml(log.details || '');
            const ipText = escapeHtml(log.ip_address || '—');

            html += `
                <tr>
                    <td class="ps-4 py-3 text-nowrap font-monospace small text-secondary">
                        ${escapeHtml(log.timestamp_formatted)}
                    </td>
                    <td class="py-3">
                        <div class="d-flex flex-column align-items-start gap-1">
                            ${roleBadge}
                            <div class="fw-semibold text-dark small">${username}</div>
                            ${userDesc}
                        </div>
                    </td>
                    <td class="py-3">
                        <span class="d-inline-flex align-items-center gap-1 fw-medium text-dark small">
                            <span class="d-inline-block rounded-circle" style="width: 6px; height: 6px; background-color: #00334e;"></span>
                            ${actionText}
                        </span>
                    </td>
                    <td class="py-3 text-secondary small" style="word-break: break-word;">
                        ${detailsText}
                    </td>
                    <td class="pe-4 py-3 text-end font-monospace small text-muted">
                        ${ipText}
                    </td>
                </tr>
            `;
        });

        tbody.innerHTML = html;
    }

    // ── Отрисовка пагинации ──────────────────────────────────────────────────────
    function renderPagination(pg) {
        logsTotalPages = pg.total_pages || 1;
        logsTotalCount = pg.total_items || 0;

        // Обновляем счётчик в шапке
        const filteredCountEl = document.getElementById('logsFilteredCount');
        const totalCountEl = document.getElementById('logsTotalCount');
        if (filteredCountEl) filteredCountEl.textContent = pg.total_items.toLocaleString('ru-RU');
        if (totalCountEl) totalCountEl.textContent = pg.total_items.toLocaleString('ru-RU');

        // Диапазон строк в подвале
        const rangeTextEl = document.getElementById('logsPageRangeText');
        if (rangeTextEl) {
            if (pg.total_items === 0) {
                rangeTextEl.textContent = 'Показано 0–0';
            } else {
                const start = (pg.page - 1) * pg.per_page + 1;
                const end = Math.min(pg.page * pg.per_page, pg.total_items);
                rangeTextEl.textContent = `Показано ${start.toLocaleString('ru-RU')}–${end.toLocaleString('ru-RU')} из ${pg.total_items.toLocaleString('ru-RU')}`;
            }
        }

        const nav = document.getElementById('logsPaginationNav');
        if (!nav) return;

        if (logsTotalPages <= 1) {
            nav.innerHTML = '';
            return;
        }

        let navHtml = '';

        // Кнопка "Назад"
        navHtml += `
            <li class="page-item ${!pg.has_prev ? 'disabled' : ''}">
                <button class="page-link" type="button" onclick="loadLogs(${pg.page - 1})" aria-label="Предыдущая" ${!pg.has_prev ? 'tabindex="-1"' : ''}>
                    <i class="bi bi-chevron-left"></i>
                </button>
            </li>
        `;

        // Номера страниц (с вычислением диапазона вокруг текущей)
        const cur = pg.page;
        const total = pg.total_pages;
        let startPage = Math.max(1, cur - 2);
        let endPage = Math.min(total, cur + 2);

        if (cur <= 3) {
            endPage = Math.min(total, 5);
        } else if (cur >= total - 2) {
            startPage = Math.max(1, total - 4);
        }

        if (startPage > 1) {
            navHtml += `<li class="page-item"><button class="page-link" type="button" onclick="loadLogs(1)">1</button></li>`;
            if (startPage > 2) {
                navHtml += `<li class="page-item disabled"><span class="page-link">…</span></li>`;
            }
        }

        for (let p = startPage; p <= endPage; p++) {
            if (p === cur) {
                navHtml += `<li class="page-item active" aria-current="page"><span class="page-link" style="background-color: #00334e; border-color: #00334e;">${p}</span></li>`;
            } else {
                navHtml += `<li class="page-item"><button class="page-link" type="button" onclick="loadLogs(${p})">${p}</button></li>`;
            }
        }

        if (endPage < total) {
            if (endPage < total - 1) {
                navHtml += `<li class="page-item disabled"><span class="page-link">…</span></li>`;
            }
            navHtml += `<li class="page-item"><button class="page-link" type="button" onclick="loadLogs(${total})">${total}</button></li>`;
        }

        // Кнопка "Вперед"
        navHtml += `
            <li class="page-item ${!pg.has_next ? 'disabled' : ''}">
                <button class="page-link" type="button" onclick="loadLogs(${pg.page + 1})" aria-label="Следующая" ${!pg.has_next ? 'tabindex="-1"' : ''}>
                    <i class="bi bi-chevron-right"></i>
                </button>
            </li>
        `;

        nav.innerHTML = navHtml;
    }

    // ── Заполнение выпадающего списка действий ──────────────────────────────────
    function populateActionsFilter(actions) {
        const select = document.getElementById('logsActionFilter');
        if (!select || !Array.isArray(actions)) return;

        const currentVal = select.value;
        select.innerHTML = '<option value="">Все действия</option>';
        actions.forEach(act => {
            const opt = document.createElement('option');
            opt.value = act;
            opt.textContent = act;
            if (act === currentVal) opt.selected = true;
            select.appendChild(opt);
        });
    }

    // ── Смена количества строк на странице ──────────────────────────────────────
    function changeLogsPerPage(val) {
        logsPerPage = parseInt(val) || 50;
        loadLogs(1, true);
    }

    // ── Экспорт в Excel (CSV с текущими фильтрами) ───────────────────────────────
    function exportLogs() {
        const search = document.getElementById('logsSearch')?.value.trim() || '';
        const role = document.getElementById('logsRoleFilter')?.value || '';
        const action = document.getElementById('logsActionFilter')?.value || '';
        const dateRange = document.getElementById('logsDateRangeFilter')?.value || '';

        const params = new URLSearchParams({
            search: search,
            role: role,
            action: action,
            date_range: dateRange
        });

        window.location.href = `/admin/logs/export?${params.toString()}`;
    }

    // ── Очистка журнала действий ────────────────────────────────────────────────
    function confirmClearLogs(olderThan) {
        let confirmText = '';
        if (olderThan === '180_days') {
            confirmText = 'Удалить все записи журнала <strong>старше 6 месяцев</strong>? Свежие записи сохранятся.';
        } else if (olderThan === '365_days') {
            confirmText = 'Удалить все записи журнала <strong>старше 1 года</strong>? Свежие записи сохранятся.';
        } else {
            confirmText = 'Вы уверены, что хотите <strong>полностью очистить весь журнал</strong>? Все архивные записи будут удалены безвозвратно.';
        }

        if (typeof window.coppConfirm === 'function') {
            window.coppConfirm(confirmText, () => {
                executeClearLogs(olderThan);
            }, 'Подтверждение очистки');
        } else if (confirm('Подтвердите удаление записей журнала')) {
            executeClearLogs(olderThan);
        }
    }

    function executeClearLogs(olderThan) {
        const formData = new FormData();
        formData.append('older_than', olderThan);
        formData.append('csrf_token', csrfToken);

        fetch('/admin/clear_logs', {
            method: 'POST',
            body: formData,
            headers: {
                'X-Requested-With': 'XMLHttpRequest'
            }
        })
        .then(res => res.json())
        .then(data => {
            if (data.status === 'success') {
                if (typeof coppAlert === 'function') {
                    coppAlert(data.message, 'success');
                }
                loadLogs(1, true);
            } else {
                if (typeof coppAlert === 'function') {
                    coppAlert(data.message || 'Ошибка при очистке', 'error');
                }
            }
        })
        .catch(err => {
            console.error('Clear logs error:', err);
            // Если сервер ответил редиректом вместо JSON
            loadLogs(1, true);
        });
    }

    // ── Управление состоянием кнопки сброса ──────────────────────────────────────
    function updateResetButtonState(search, role, action, dateRange) {
        const resetBtn = document.getElementById('logsResetFiltersBtn');
        const clearSearchBtn = document.getElementById('logsClearSearchBtn');
        const hasFilters = Boolean(search || role || action || dateRange);

        if (resetBtn) {
            resetBtn.classList.toggle('d-none', !hasFilters);
        }
        if (clearSearchBtn) {
            clearSearchBtn.classList.toggle('d-none', !search);
        }
    }

    function resetAllLogsFilters() {
        const searchInput = document.getElementById('logsSearch');
        const roleFilter = document.getElementById('logsRoleFilter');
        const actionFilter = document.getElementById('logsActionFilter');
        const dateRangeFilter = document.getElementById('logsDateRangeFilter');

        if (searchInput) searchInput.value = '';
        if (roleFilter) roleFilter.value = '';
        if (actionFilter) actionFilter.value = '';
        if (dateRangeFilter) dateRangeFilter.value = '';

        loadLogs(1, true);
    }

    // ── Инициализация слушателей событий ─────────────────────────────────────────
    document.addEventListener('DOMContentLoaded', function() {
        // Поиск с дебаунсом (300 мс)
        const searchInput = document.getElementById('logsSearch');
        if (searchInput) {
            searchInput.addEventListener('input', function() {
                clearTimeout(logsSearchTimer);
                logsSearchTimer = setTimeout(() => {
                    loadLogs(1, false);
                }, 300);
            });
        }

        // Кнопка очистки строки поиска
        const clearSearchBtn = document.getElementById('logsClearSearchBtn');
        if (clearSearchBtn) {
            clearSearchBtn.addEventListener('click', function() {
                if (searchInput) {
                    searchInput.value = '';
                    loadLogs(1, false);
                }
            });
        }

        // Селекторы фильтров
        ['logsRoleFilter', 'logsActionFilter', 'logsDateRangeFilter'].forEach(id => {
            const el = document.getElementById(id);
            if (el) {
                el.addEventListener('change', () => loadLogs(1, false));
            }
        });

        // Кнопка сброса фильтров
        const resetBtn = document.getElementById('logsResetFiltersBtn');
        if (resetBtn) {
            resetBtn.addEventListener('click', resetAllLogsFilters);
        }

        // ── Ленивая загрузка при клике на вкладку ──────────────────────────────────
        const logsTabBtn = document.querySelector('button[data-bs-target="#logsTab"], a[data-bs-target="#logsTab"]');
        if (logsTabBtn) {
            logsTabBtn.addEventListener('shown.bs.tab', function() {
                if (!logsLoadedOnce) {
                    loadLogs(1, false);
                }
            });
        }

        // Если страница сразу открыта на вкладке логов (например, ?tab=logsTab)
        const logsTabPane = document.getElementById('logsTab');
        if (logsTabPane && logsTabPane.classList.contains('active')) {
            loadLogs(1, false);
        }
    });
</script>

    @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
    }
    .spin-animation {
        display: inline-block;
        animation: spin 0.8s linear infinite;
