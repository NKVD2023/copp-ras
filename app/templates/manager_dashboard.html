<!-- 
  VIEWER_DASHBOARD.HTML
  Панель наблюдателя (министерства).
  Позволяет только просматривать и выгружать отчеты (Read-Only).
-->
{% extends "base.html" %}
{% block title %}ЦОПП | Кабинет менеджера{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/manager.css') }}">
{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <div>
        <h3 class="fw-bold text-dark m-0">Панель наблюдателя</h3>
        <!-- <p class="text-muted small m-0">Интерфейс аналитического просмотра</p> -->
    </div>
    <!-- <a href="{{ url_for('admin.constructor') }}" class="btn btn-copp px-4">Создать новый отчет</a> -->
</div>

<ul class="nav nav-tabs mb-4" id="managerTabs" role="tablist">
    <li class="nav-item">
        <button class="nav-link active" data-bs-toggle="tab" data-bs-target="#monitoringTab" type="button">Мониторинг отчетов</button>
    </li>
    <li class="nav-item">
        <button class="nav-link" data-bs-toggle="tab" data-bs-target="#futureTab" type="button" tabindex="">Резервная вкладка</button>
    </li>
</ul>

<div class="tab-content">
    
    <div class="tab-pane fade show active" id="monitoringTab" role="tabpanel">
        {% include 'admin_tabs/reports_tabs.html' %}
    </div>

    <div class="tab-pane fade" id="futureTab" role="tabpanel">
        <div class="text-center py-5 text-muted bg-white rounded border">Здесь появится новый функционал.</div>
    </div>

</div>

<script>
    document.addEventListener("DOMContentLoaded", function () {
        const searchInput = document.getElementById('reportSearch');
        if (searchInput) {
            searchInput.addEventListener('input', function () {
                const query = this.value.toLowerCase();
                const reportItems = document.querySelectorAll('.report-item');

                reportItems.forEach(function (item) {
                    const textContent = item.textContent.toLowerCase();
                    if (textContent.includes(query)) {
                        item.style.display = '';
                    } else {
                        item.style.display = 'none';
                    }
                });
            });
        }
    });
</script>
<script src="{{ url_for('static', filename='js/bootstrap.bundle.min.js') }}"></script>
{% endblock %}
{% block extra_js %}
    <script>
        function exportExcel(btn, templateId) {
            const originalHtml = btn.innerHTML;
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span> Запуск...';
            
            fetch(`/export_excel/${templateId}`)
                .then(response => response.json())
                .then(data => {
                    if (data.status === 'success') {
                        const taskId = data.task_id;
                        pollTaskStatus(taskId, btn, originalHtml);
                    } else {
                        alert("Ошибка запуска формирования файла");
                        btn.disabled = false;
                        btn.innerHTML = originalHtml;
                    }
                })
                .catch(err => {
                    alert("Произошла ошибка при обращении к серверу");
                    btn.disabled = false;
                    btn.innerHTML = originalHtml;
                });
        }
        
        function pollTaskStatus(taskId, btn, originalHtml) {
            btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span> Формируется...';
            fetch(`/task_status/${taskId}`)
                .then(response => response.json())
                .then(data => {
                    if (data.status === 'SUCCESS') {
                        btn.disabled = false;
                        btn.innerHTML = originalHtml;
                        window.location.href = `/task_download/${taskId}`;
                    } else if (data.status === 'FAILED') {
                        alert("Ошибка формирования файла: " + data.message);
                        btn.disabled = false;
                        btn.innerHTML = originalHtml;
                    } else {
                        setTimeout(() => pollTaskStatus(taskId, btn, originalHtml), 1000);
                    }
                })
                .catch(err => {
                    setTimeout(() => pollTaskStatus(taskId, btn, originalHtml), 1000);
                });
        }
    </script>
{% endblock %}
