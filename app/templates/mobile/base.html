<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>{% block title %}ЦОПП РК{% endblock %}</title>
    
    <!-- Bootstrap CSS -->
    <link href="{{ url_for('static', filename='css/bootstrap.min.css') }}" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    
    <!-- Custom Mobile CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/mobile_app.css') }}">
    
    <!-- Toastify CSS -->
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
    
    {% block extra_css %}{% endblock %}
</head>
<body>
    
    <!-- Top Header -->
    <div class="bg-white px-3 py-3 shadow-sm d-flex justify-content-between align-items-center" style="position: sticky; top: 0; z-index: 1020;">
        <a href="/" class="text-decoration-none d-flex align-items-center gap-2">
            <img src="{{ url_for('static', filename='img/logoblue2.png') }}" alt="Логотип" height="32">
            <div class="d-flex flex-column justify-content-center lh-1">
                <span class="fw-bold text-dark mb-1" style="font-size: 0.85rem;">Республики Крым</span>
                <span class="text-muted" style="font-size: 0.6rem;">Региональная Аналитическая Система</span>
            </div>
        </a>
        <div class="d-flex align-items-center gap-2">
            <span class="badge bg-light text-dark border">{{ current_user.username }}</span>
            <a href="{{ url_for('auth.logout') }}" class="text-danger"><i class="bi bi-box-arrow-right fs-5"></i></a>
        </div>
    </div>

    <!-- Main Content -->
    <div class="container-fluid px-3 py-3">
        {% block content %}{% endblock %}
    </div>

    <!-- Bottom Navigation -->
    {% block bottom_nav %}
    <nav class="bottom-nav">
        <a href="{{ url_for('reports.dashboard') }}#active" class="bottom-nav-item active" id="nav-active">
            <i class="bi bi-clipboard-data"></i>
            Активные
        </a>
        <a href="{{ url_for('reports.dashboard') }}#filled" class="bottom-nav-item" id="nav-filled">
            <i class="bi bi-check-all"></i>
            Завершенные
        </a>
        <a href="{{ url_for('reports.dashboard') }}#profile" class="bottom-nav-item" id="nav-profile">
            <i class="bi bi-person"></i>
            Профиль
        </a>
        <a href="{{ url_for('reports.dashboard') }}#analytics" class="bottom-nav-item d-none" id="nav-analytics">
            <i class="bi bi-bar-chart"></i>
            Статистика
        </a>
    </nav>
    
    <script>
        // Simple logic to highlight active nav item based on hash
        window.addEventListener('hashchange', updateNav);
        window.addEventListener('load', updateNav);
        
        function updateNav() {
            document.querySelectorAll('.bottom-nav-item').forEach(el => el.classList.remove('active'));
            let hash = window.location.hash || '#active';
            let navItem = document.querySelector(`.bottom-nav-item[href*="${hash}"]`);
            if (navItem) {
                navItem.classList.add('active');
            } else {
                document.getElementById('nav-active').classList.add('active');
            }
        }
    </script>
    {% endblock %}

    <!-- Scripts -->
    <script src="{{ url_for('static', filename='js/bootstrap.bundle.min.js') }}"></script>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
    <script src="{{ url_for('static', filename='js/sweetalert2.all.min.js') }}"></script>
    <script>
        window.coppAlert = function(text, type='info', title='Внимание') {
            return Swal.fire({
                title: title,
                html: text,
                icon: type,
                confirmButtonColor: '#003366',
                confirmButtonText: 'OK'
            });
        };
        window.coppConfirm = function(text, onConfirmCallback, title='Подтверждение') {
            Swal.fire({
                title: title,
                html: text,
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#003366',
                cancelButtonColor: '#6c757d',
                confirmButtonText: 'Да, продолжить',
                cancelButtonText: 'Отмена'
            }).then((result) => {
                if (result.isConfirmed && onConfirmCallback) {
                    onConfirmCallback();
                }
            });
        };
    </script>
    
    <script>
        function showNotification(message, type='success') {
            Toastify({
                text: message,
                duration: 3000,
                gravity: "top",
                position: "center",
                style: {
                    background: type === 'success' ? "#00334e" : (type === 'error' ? "#dc3545" : "#6c757d"),
                    borderRadius: "8px",
                    boxShadow: "0 4px 12px rgba(0,0,0,0.1)",
                    fontSize: "14px"
                }
            }).showToast();
        }
    </script>
    {% block scripts %}{% endblock %}
</body>
</html>
