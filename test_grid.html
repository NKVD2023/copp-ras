<!DOCTYPE html>
<html>
<head>
<style>
.fields-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(420px, 1fr));
    gap: 1.5rem;
    align-items: stretch;
}
.grid-item {
    display: grid;
    grid-template-rows: subgrid;
    grid-row: span 3;
    background: lightgray;
    border: 1px solid black;
}
</style>
</head>
<body style="width: 1200px;">
    <div class="fields-grid">
        <div class="grid-item">

        </div>

</body>
</html>
